<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Bootleg Trading List</title>
  <!-- Load PapaParse to read CSV files -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <!-- Cache-buster update -->
  <link rel="stylesheet" href="style.css?v=6.0" />
</head>
<body>

  <header class="container">
    <h1>🎭 My Trading Collection</h1>
    <div class="rules-box">
      <div class="rules-box-inner">
        <h2>Trading Rules & Contact</h2>
        <p><strong>Contact:</strong> <code>tradingtreelost@gmail.com</code></p>
        <ul>
          <li>Standard trading ratios apply (1 Video = 2 Audios).</li>
          <li>Direct non-expiring links (Mega, Google Drive) only.</li>
          <li>Respect all NFT dates and master restrictions.</li>
        </ul>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="controls">
      <input type="text" id="search-input" placeholder="Search by show, cast, date, venue..." />
      
      <!-- Primary Format Filters -->
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All Formats</button>
        <button class="filter-btn" data-filter="Video">Videos</button>
        <button class="filter-btn" data-filter="Audio">Audios</button>
      </div>

      <!-- Category Location Filters -->
      <div class="filters category-filters">
        <button class="cat-btn active" data-category="all">All Locations</button>
        <button class="cat-btn" data-category="broadway">Broadway</button>
        <button class="cat-btn" data-category="off-broadway">Off-Broadway</button>
        <button class="cat-btn" data-category="west end">West End</button>
      </div>
    </div>

    <div id="stats">Loading collection...</div>
    <div id="card-container"></div>
  </main>

  <!-- Scroll to Top Floating Button -->
  <button id="scroll-top-btn" title="Back to Top">⬆ TOP</button>

  <script src="script.js?v=6.0"></script>
</body>
</html>
