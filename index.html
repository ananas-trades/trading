<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Bootleg Trading List</title>
  <!-- Load PapaParse to read CSV files -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <link rel="stylesheet" href="style.css?v=100.0" />
</head>
<body>

  <header class="container">
    <h1>🎭 My Trading Collection</h1>
    <div class="rules-box">
      <div class="rules-box-inner">
        <h2>Trading Rules & Contact</h2>
        <p>
          <strong>Contact:</strong> <code>tradingtreelost@gmail.com</code> 
          <button id="copy-email-btn" class="mini-btn">📋 Copy Email</button>
        </p>
        <ul>
          <li>Standard trading ratios apply (1 Video = 2 Audios).</li>
          <li>Direct non-expiring links (Mega, Google Drive) only.</li>
          <li>Respect all NFT dates and master restrictions.</li>
        </ul>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="controls">
      <!-- Search Bar with Clear 'X' Button -->
      <div class="search-wrapper">
        <input type="text" id="search-input" placeholder="Search show, cast, date, venue..." />
        <button id="clear-search" class="clear-btn" title="Clear Search">&times;</button>
      </div>

      <!-- Main Filters -->
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="Video">Videos</button>
        <button class="filter-btn" data-filter="Audio">Audios</button>
      </div>

     <!-- Quick Location Badges -->
      <div class="filters sub-filters">
        <button class="sub-filter-btn" data-subfilter="broadway">Broadway</button>
        <button class="sub-filter-btn" data-subfilter="off-broadway">Off-Broadway</button>
        <button class="sub-filter-btn" data-subfilter="west end">West End</button>
      </div>
    </div>

    <div id="stats">Loading collection...</div>
    <div id="card-container"></div>
  </main>

  <!-- Floating Back To Top Button -->
  <button id="back-to-top" title="Back to top">⬆️ TOP</button>

  <!-- Toast Notification Container -->
  <div id="toast" class="toast-hidden">Copied to clipboard!</div>

  <script src="script.js?v=100.0"></script>
</body>
</html>
